[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skipera"
version = "2.0.0"
description = "Skipera V2 — skip mandatory Coursera courses in seconds"
readme = "README.md"
license = "MIT"
authors = [
    { name = "derispewss", email = "derisfirmansyah177@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "loguru>=0.7",
    "pydantic>=2.0",
    "requests>=2.28",
    "browser-cookie3>=0.19",
    "google-genai",
]

[project.scripts]
skipera = "main:main"

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/derispewss/skipera-v2"
Issues = "https://github.com/derispewss/skipera-v2/issues"

[tool.setuptools]
py-modules = ["config", "report", "main", "capture"]
packages = ["assessment", "llm", "watcher"]
